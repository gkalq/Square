<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Matrix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0e1a;
      --card:    #15152a;
      --raised:  #1c1c33;
      --hover:   #20203a;
      --border:  #2a2a44;
      --text:    #e4e4f4;
      --dim:     #7878a0;
      --muted:   #40405a;
      --q1: #f87171;
      --q2: #60a5fa;
      --q3: #fbbf24;
      --q4: #94a3b8;
      --ease: .15s ease;
      --r: 11px;
    }

    html { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      flex-shrink: 0;
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: grid;
      grid-template: 1fr 1fr / 1fr 1fr;
      gap: 2.5px;
      width: 24px; height: 24px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo span { display: block; }
    .logo .a { background: var(--q1); }
    .logo .b { background: var(--q2); }
    .logo .c { background: var(--q3); }
    .logo .d { background: var(--q4); }

    .app-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-right: auto;
    }

    .filter-group {
      display: flex;
      gap: 2px;
      background: var(--raised);
      padding: 3px;
      border-radius: 7px;
    }

    .pill {
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: var(--ease);
      font-family: inherit;
      letter-spacing: .2px;
    }

    .pill.on { background: var(--hover); color: var(--text); }
    .pill:not(.on):hover { color: var(--text); }

    .hbtn {
      width: 30px; height: 30px;
      display: grid; place-items: center;
      border: none; background: transparent;
      color: var(--dim); cursor: pointer;
      border-radius: 7px;
      transition: var(--ease);
    }

    .hbtn:hover { background: var(--raised); color: var(--text); }
    .hbtn svg { width: 15px; height: 15px; }

    /* ── Progress ────────────────────────────────────────── */
    .prog {
      flex-shrink: 0;
      height: 2px;
      background: var(--border);
    }

    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--q2) 0%, var(--q1) 100%);
      transition: width .4s ease;
      width: 0%;
    }

    /* ── Grid ────────────────────────────────────────────── */
    main {
      flex: 1;
      overflow: hidden;
      display: grid;
      grid-template: 1fr 1fr / 1fr 1fr;
      gap: 7px;
      padding: 7px;
    }

    /* ── Quadrant ────────────────────────────────────────── */
    .quad {
      background: var(--card);
      border-radius: var(--r);
      border: 1px solid var(--border);
      border-left: 3px solid var(--qc);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color var(--ease);
    }

    .q1 { --qc: var(--q1); }
    .q2 { --qc: var(--q2); }
    .q3 { --qc: var(--q3); }
    .q4 { --qc: var(--q4); }

    .quad.drag-over {
      border-color: var(--qc);
      background: color-mix(in srgb, var(--qc) 5%, var(--card));
    }

    .q-head {
      flex-shrink: 0;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 10px 0 10px;
      gap: 7px;
      border-bottom: 1px solid var(--border);
    }

    .q-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--qc);
      flex-shrink: 0;
    }

    .q-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .9px;
      color: var(--qc);
      flex: 1;
    }

    .q-badge {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--dim);
    }

    .q-clr {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      transition: var(--ease);
      font-family: inherit;
      display: none;
    }

    .q-clr.show { display: block; }
    .q-clr:hover { color: var(--q1); }

    /* ── Input row ───────────────────────────────────────── */
    .q-row {
      flex-shrink: 0;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }

    .q-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 12.5px;
      font-family: inherit;
      color: var(--text);
    }

    .q-input::placeholder { color: var(--muted); }

    .q-plus {
      width: 22px; height: 22px;
      border-radius: 5px;
      border: none;
      background: var(--qc);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      line-height: 1;
      opacity: .65;
      transition: opacity var(--ease);
    }

    .q-plus:hover { opacity: 1; }

    /* ── Task list ───────────────────────────────────────── */
    .q-list {
      flex: 1;
      overflow-y: auto;
      padding: 3px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .q-list::-webkit-scrollbar { width: 3px; }
    .q-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      color: var(--muted);
      padding: 12px;
      text-align: center;
    }

    /* ── Task item ───────────────────────────────────────── */
    .task {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 5px 10px 5px 12px;
      min-height: 30px;
      cursor: grab;
      transition: background var(--ease);
      animation: fadein .12s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(-3px); }
      to   { opacity: 1; transform: none; }
    }

    .task:hover { background: var(--hover); }
    .task.dragging { opacity: .25; cursor: grabbing; }

    .task-cb {
      width: 14px; height: 14px;
      border-radius: 3px;
      border: 1.5px solid var(--muted);
      flex-shrink: 0;
      cursor: pointer;
      display: grid; place-items: center;
      margin-top: 2px;
      transition: background var(--ease), border-color var(--ease);
    }

    .task-cb:hover { border-color: var(--qc); }
    .task.done .task-cb { background: var(--qc); border-color: var(--qc); }

    .tick { display: none; }
    .task.done .tick { display: block; }

    .task-txt {
      flex: 1;
      font-size: 12.5px;
      line-height: 1.42;
      color: var(--text);
      word-break: break-word;
    }

    .task.done .task-txt { text-decoration: line-through; color: var(--muted); }

    .task-txt[contenteditable="true"] {
      outline: none;
      background: color-mix(in srgb, var(--qc) 10%, transparent);
      border-radius: 3px;
      padding: 0 3px;
      margin: 0 -3px;
    }

    .task-del {
      width: 18px; height: 18px;
      border: none; background: transparent;
      color: var(--muted); cursor: pointer;
      border-radius: 4px;
      display: grid; place-items: center;
      opacity: 0;
      transition: opacity var(--ease), background var(--ease), color var(--ease);
      flex-shrink: 0;
    }

    .task:hover .task-del { opacity: 1; }
    .task-del:hover { background: color-mix(in srgb, var(--q1) 15%, transparent); color: var(--q1); }
    .task-del svg { width: 11px; height: 11px; }

    /* ── History panel ───────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(5px);
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease;
    }

    .overlay.on { opacity: 1; pointer-events: all; }

    .panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 320px; max-width: 88vw;
      background: var(--card);
      border-left: 1px solid var(--border);
      z-index: 110;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .22s ease;
    }

    .panel.on { transform: none; }

    .panel-head {
      flex-shrink: 0;
      height: 50px;
      display: flex; align-items: center;
      padding: 0 14px; gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { flex: 1; font-size: 14px; font-weight: 600; }

    .panel-clr {
      font-size: 11px; color: var(--dim);
      background: none; border: none; cursor: pointer;
      transition: color var(--ease); font-family: inherit;
    }

    .panel-clr:hover { color: var(--q1); }

    .close-btn {
      width: 26px; height: 26px;
      border: none; background: var(--raised);
      border-radius: 6px; color: var(--dim);
      cursor: pointer; display: grid; place-items: center;
      transition: var(--ease);
    }

    .close-btn:hover { color: var(--text); }
    .close-btn svg { width: 12px; height: 12px; }

    .panel-body {
      flex: 1; overflow-y: auto;
      padding: 6px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .hist-empty {
      height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--muted);
    }

    .hist-date {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted);
      padding: 10px 14px 5px;
    }

    .hist-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      transition: background var(--ease);
    }

    .hist-row:hover { background: var(--hover); }

    .hdot {
      width: 5px; height: 5px;
      border-radius: 50%; flex-shrink: 0;
    }

    .hist-text {
      flex: 1; font-size: 12px; color: var(--dim);
      word-break: break-word;
    }

    .hist-time { font-size: 10px; color: var(--muted); flex-shrink: 0; }

    .hist-restore {
      width: 18px; height: 18px;
      border: none; background: transparent;
      color: var(--muted); cursor: pointer;
      border-radius: 3px;
      display: grid; place-items: center;
      opacity: 0; transition: opacity var(--ease), color var(--ease);
      flex-shrink: 0;
    }

    .hist-row:hover .hist-restore { opacity: 1; }
    .hist-restore:hover { color: var(--q2); }
    .hist-restore svg { width: 11px; height: 11px; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-wrap {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: grid; place-items: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease;
    }

    .modal-wrap.on { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      max-width: 360px; width: 100%;
      transform: scale(.96);
      transition: transform .18s ease;
    }

    .modal-wrap.on .modal { transform: none; }

    .modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 7px; }

    .modal p {
      font-size: 12.5px; color: var(--dim);
      line-height: 1.5; margin-bottom: 18px;
    }

    .modal-acts { display: flex; gap: 7px; justify-content: flex-end; }

    .btn {
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--dim);
      font-size: 12.5px; font-weight: 500;
      cursor: pointer; transition: var(--ease);
      font-family: inherit;
    }

    .btn:hover { background: var(--raised); color: var(--text); }

    .btn-ok {
      background: var(--text); color: var(--bg);
      border-color: transparent;
    }

    .btn-ok:hover { opacity: .88; }

    .btn-red {
      background: color-mix(in srgb, var(--q1) 14%, transparent);
      color: var(--q1); border-color: transparent;
    }

    .btn-red:hover { background: color-mix(in srgb, var(--q1) 22%, transparent); }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      display: flex; align-items: center; gap: 12px;
      font-size: 12.5px; color: var(--text);
      z-index: 300;
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
      opacity: 0;
      transition: transform .22s ease, opacity .22s ease;
      white-space: nowrap;
    }

    .toast.on {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-undo {
      background: none; border: none;
      color: var(--q2); font-size: 12.5px; font-weight: 600;
      cursor: pointer; font-family: inherit; padding: 0;
    }

    /* ── Mobile fallback ─────────────────────────────────── */
    @media (max-width: 580px) {
      html { height: auto; }
      body { height: auto; min-height: 100dvh; overflow: auto; }
      main {
        grid-template: repeat(4, auto) / 1fr;
        height: auto; overflow: visible;
      }
      .quad { min-height: 220px; }
    }

    #fileIn { display: none; }

    /* ── Lock screen ─────────────────────────────────────── */
    .lock-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease;
    }
    .lock-screen.hidden { opacity: 0; pointer-events: none; }

    .lock-box {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
    }

    .lock-logo {
      display: grid;
      grid-template: 1fr 1fr / 1fr 1fr;
      gap: 4px;
      width: 44px; height: 44px;
      border-radius: 10px;
      overflow: hidden;
    }
    .lock-logo span { display: block; }

    .lock-title { font-size: 22px; font-weight: 700; color: var(--text); }
    .lock-sub { font-size: 13px; color: var(--dim); }

    .lock-input {
      width: 220px;
      padding: 11px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
      transition: border-color var(--ease);
    }
    .lock-input:focus { border-color: var(--q2); }
    .lock-input::placeholder { letter-spacing: 0; }

    .lock-btn {
      width: 220px;
      padding: 11px;
      background: var(--text);
      color: var(--bg);
      border: none; border-radius: 9px;
      font-size: 13.5px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: opacity var(--ease);
    }
    .lock-btn:hover { opacity: .85; }
    .lock-btn:disabled { opacity: .45; cursor: default; }

    .lock-error {
      font-size: 12px; color: var(--q1);
      min-height: 16px; text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="a"></span><span class="b"></span>
    <span class="c"></span><span class="d"></span>
  </div>
  <span class="app-title">Matrix</span>

  <div class="filter-group">
    <button class="pill on" data-f="all">All</button>
    <button class="pill" data-f="active">Active</button>
    <button class="pill" data-f="done">Done</button>
  </div>

  <button class="hbtn" id="hHistBtn" title="History (H)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  </button>

  <button class="hbtn" id="hExportBtn" title="Export JSON">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
  </button>

  <button class="hbtn" id="hImportBtn" title="Import JSON">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
  </button>

  <button class="hbtn" id="hClearBtn" title="Clear all tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
      <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
    </svg>
  </button>

  <button class="hbtn" id="hLockBtn" title="Lock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0110 0v4"/>
    </svg>
  </button>
</header>

<div class="prog"><div class="prog-fill" id="progFill"></div></div>

<main id="mx">
  <!-- Q1 -->
  <div class="quad q1" id="Q-q1" data-q="q1">
    <div class="q-head">
      <div class="q-dot"></div>
      <span class="q-label">Do First</span>
      <span class="q-badge" id="badge-q1"></span>
      <button class="q-clr" id="clr-q1" data-q="q1">clear done</button>
    </div>
    <div class="q-row">
      <input class="q-input" id="in-q1" placeholder="Important · Urgent" autocomplete="off">
      <button class="q-plus" data-q="q1">+</button>
    </div>
    <div class="q-list" id="L-q1"></div>
  </div>

  <!-- Q2 -->
  <div class="quad q2" id="Q-q2" data-q="q2">
    <div class="q-head">
      <div class="q-dot"></div>
      <span class="q-label">Schedule</span>
      <span class="q-badge" id="badge-q2"></span>
      <button class="q-clr" id="clr-q2" data-q="q2">clear done</button>
    </div>
    <div class="q-row">
      <input class="q-input" id="in-q2" placeholder="Important · Not Urgent" autocomplete="off">
      <button class="q-plus" data-q="q2">+</button>
    </div>
    <div class="q-list" id="L-q2"></div>
  </div>

  <!-- Q3 -->
  <div class="quad q3" id="Q-q3" data-q="q3">
    <div class="q-head">
      <div class="q-dot"></div>
      <span class="q-label">Delegate</span>
      <span class="q-badge" id="badge-q3"></span>
      <button class="q-clr" id="clr-q3" data-q="q3">clear done</button>
    </div>
    <div class="q-row">
      <input class="q-input" id="in-q3" placeholder="Not Important · Urgent" autocomplete="off">
      <button class="q-plus" data-q="q3">+</button>
    </div>
    <div class="q-list" id="L-q3"></div>
  </div>

  <!-- Q4 -->
  <div class="quad q4" id="Q-q4" data-q="q4">
    <div class="q-head">
      <div class="q-dot"></div>
      <span class="q-label">Eliminate</span>
      <span class="q-badge" id="badge-q4"></span>
      <button class="q-clr" id="clr-q4" data-q="q4">clear done</button>
    </div>
    <div class="q-row">
      <input class="q-input" id="in-q4" placeholder="Not Important · Not Urgent" autocomplete="off">
      <button class="q-plus" data-q="q4">+</button>
    </div>
    <div class="q-list" id="L-q4"></div>
  </div>
</main>

<!-- History panel -->
<div class="overlay" id="ov"></div>
<div class="panel" id="histPanel">
  <div class="panel-head">
    <span class="panel-title">History</span>
    <button class="panel-clr" id="histClrAll">Clear all</button>
    <button class="close-btn" id="histClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="panel-body" id="histBody"></div>
</div>

<!-- Confirm modal -->
<div class="modal-wrap" id="confirmWrap">
  <div class="modal">
    <h2 id="confTitle"></h2>
    <p id="confBody"></p>
    <div class="modal-acts">
      <button class="btn" id="confCancel">Cancel</button>
      <button class="btn btn-red" id="confOk"></button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div class="modal-wrap" id="importWrap">
  <div class="modal">
    <h2>Import</h2>
    <p id="importBody"></p>
    <div class="modal-acts">
      <button class="btn" id="importCancel">Cancel</button>
      <button class="btn btn-ok" id="importOk">Import</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button class="toast-undo" id="toastUndo" style="display:none">Undo</button>
</div>

<input type="file" id="fileIn" accept=".json">

<!-- Lock screen -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-logo">
      <span style="background:var(--q1)"></span>
      <span style="background:var(--q2)"></span>
      <span style="background:var(--q3)"></span>
      <span style="background:var(--q4)"></span>
    </div>
    <h1 class="lock-title">Matrix</h1>
    <p class="lock-sub">Enter your passcode to continue</p>
    <input type="password" id="lockInput" class="lock-input" placeholder="Passcode" autocomplete="current-password">
    <button id="lockSubmit" class="lock-btn">Unlock</button>
    <p id="lockError" class="lock-error"></p>
  </div>
</div>

<script>
'use strict';

const QS = ['q1','q2','q3','q4'];
const QC = { q1:'#f87171', q2:'#60a5fa', q3:'#fbbf24', q4:'#94a3b8' };

let S = { q1:[], q2:[], q3:[], q4:[] };
let H = [];
let filt = 'all';
let drag = null;
let confFn = null;
let importData = null;
let toastTmr = null;
let saveTimer = null;

// ── API / Auth ────────────────────────────────────────────
let token = localStorage.getItem('mx_token');

async function apiGet() {
  const r = await fetch('/api/data', { headers: { Authorization: `Bearer ${token}` } });
  if (r.status === 401) { showLock(); return null; }
  if (!r.ok) throw new Error('fetch failed');
  return r.json();
}

async function apiPut() {
  const r = await fetch('/api/data', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify({ tasks: S, history: H })
  });
  if (r.status === 401) showLock();
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => apiPut().catch(() => {}), 500);
}

function showLock() {
  token = null;
  localStorage.removeItem('mx_token');
  document.getElementById('lockScreen').classList.remove('hidden');
  setTimeout(() => document.getElementById('lockInput').focus(), 50);
}

function hideLock() {
  document.getElementById('lockScreen').classList.add('hidden');
}

// ── Helpers ───────────────────────────────────────────────
const uid = () => crypto.randomUUID();
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fmtDate(ts) {
  const d = new Date(ts), n = new Date();
  const diff = new Date(n.getFullYear(), n.getMonth(), n.getDate()) -
               new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (diff === 0) return 'Today';
  if (diff === 86400000) return 'Yesterday';
  return d.toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' });
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function snap() {
  return { S: JSON.parse(JSON.stringify(S)), H: JSON.parse(JSON.stringify(H)) };
}

// ── Render ────────────────────────────────────────────────
function render() {
  QS.forEach(renderQ);
  const total = QS.reduce((n,q) => n + S[q].length, 0);
  const done  = QS.reduce((n,q) => n + S[q].filter(t=>t.done).length, 0);
  document.getElementById('progFill').style.width = total ? `${done/total*100}%` : '0%';
  document.title = total ? `Matrix (${done}/${total})` : 'Matrix';
  persist();
}

function renderQ(q) {
  const list  = document.getElementById(`L-${q}`);
  const badge = document.getElementById(`badge-${q}`);
  const clrBtn = document.getElementById(`clr-${q}`);
  const all  = S[q];
  const done = all.filter(t=>t.done).length;

  badge.textContent = filt === 'done' ? done : filt === 'active' ? all.length - done : all.length;
  clrBtn.classList.toggle('show', done > 0 && filt !== 'active');

  const vis = all.filter(t => filt==='active'?!t.done : filt==='done'?t.done : true);

  if (!vis.length) {
    const m = filt==='done'?'No completed tasks':filt==='active'?'No active tasks':'Add a task above';
    list.innerHTML = `<div class="empty">${m}</div>`;
    return;
  }

  list.innerHTML = '';
  vis.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task' + (t.done ? ' done' : '');
    el.dataset.id = t.id; el.dataset.q = q;
    el.draggable = true;
    el.innerHTML = `
      <div class="task-cb" data-id="${t.id}" data-q="${q}">
        <svg class="tick" width="9" height="9" viewBox="0 0 9 9" fill="none">
          <path d="M1.5 4.5L3.5 7 7.5 2" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-txt" data-id="${t.id}" data-q="${q}">${esc(t.text)}</div>
      <button class="task-del" data-id="${t.id}" data-q="${q}" title="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>`;
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend', onDragEnd);
    list.appendChild(el);
  });
}

function renderHist() {
  const body = document.getElementById('histBody');
  if (!H.length) { body.innerHTML = '<div class="hist-empty">No history yet</div>'; return; }

  const groups = {};
  [...H].reverse().forEach(item => {
    const k = fmtDate(item.at);
    (groups[k] = groups[k] || []).push(item);
  });

  body.innerHTML = '';
  for (const [label, items] of Object.entries(groups)) {
    const d = document.createElement('div');
    d.className = 'hist-date'; d.textContent = label;
    body.appendChild(d);
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'hist-row';
      row.innerHTML = `
        <span class="hdot" style="background:${QC[item.q]}"></span>
        <span class="hist-text">${esc(item.text)}</span>
        <span class="hist-time">${fmtTime(item.at)}</span>
        <button class="hist-restore" data-id="${item.id}" title="Restore to quadrant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
          </svg>
        </button>`;
      row.querySelector('.hist-restore').addEventListener('click', () => restoreHist(item));
      body.appendChild(row);
    });
  }
}

// ── Task ops ──────────────────────────────────────────────
function addTask(q) {
  const inp = document.getElementById(`in-${q}`);
  const txt = inp.value.trim();
  if (!txt) return;
  S[q].unshift({ id: uid(), text: txt, done: false, at: Date.now() });
  inp.value = '';
  render();
  inp.focus();
}

function toggleTask(q, id) {
  const t = S[q].find(t => t.id === id);
  if (t) { t.done = !t.done; render(); }
}

function deleteTask(q, id) {
  const bk = snap();
  S[q] = S[q].filter(t => t.id !== id);
  render();
  toast('Task deleted', () => { S = bk.S; H = bk.H; render(); });
}

function clearDone(q) {
  const done = S[q].filter(t => t.done);
  if (!done.length) return;
  const now = Date.now();
  done.forEach(t => H.push({ id: uid(), text: t.text, q, at: now }));
  if (H.length > 1000) H = H.slice(-1000);
  S[q] = S[q].filter(t => !t.done);
  render();
  toast(`${done.length} task${done.length>1?'s':''} archived`);
}

function clearAll() {
  openConfirm('Clear all tasks?',
    'Completed tasks move to history. Active tasks are removed permanently.',
    'Clear all', () => {
      const now = Date.now();
      QS.forEach(q => {
        S[q].filter(t=>t.done).forEach(t => H.push({ id: uid(), text: t.text, q, at: now }));
        S[q] = [];
      });
      if (H.length > 1000) H = H.slice(-1000);
      render();
    });
}

function restoreHist(item) {
  S[item.q].unshift({ id: uid(), text: item.text, done: false, at: Date.now() });
  H = H.filter(h => h.id !== item.id);
  render();
  renderHist();
  toast('Task restored');
}

// ── Edit ──────────────────────────────────────────────────
function startEdit(el, q, id) {
  el.contentEditable = 'true';
  el.focus();
  const r = document.createRange();
  r.selectNodeContents(el);
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(r);

  const finish = () => {
    el.contentEditable = 'false';
    const t = S[q].find(t => t.id === id);
    const txt = el.textContent.trim();
    if (t && txt) t.text = txt; else render();
    persist();
    el.removeEventListener('blur', finish);
    el.removeEventListener('keydown', onK);
  };
  const onK = e => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') render();
  };
  el.addEventListener('blur', finish);
  el.addEventListener('keydown', onK);
}

// ── Drag ─────────────────────────────────────────────────
function onDragStart(e) {
  drag = { q: e.currentTarget.dataset.q, id: e.currentTarget.dataset.id };
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.quad').forEach(q => q.classList.remove('drag-over'));
}

QS.forEach(q => {
  const el = document.getElementById(`Q-${q}`);
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over'); });
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    if (!drag || drag.q === q) { drag = null; return; }
    const i = S[drag.q].findIndex(t => t.id === drag.id);
    if (i < 0) { drag = null; return; }
    const [task] = S[drag.q].splice(i, 1);
    S[q].unshift(task);
    drag = null;
    render();
  });
});

// ── Confirm modal ─────────────────────────────────────────
function openConfirm(title, body, label, fn) {
  confFn = fn;
  document.getElementById('confTitle').textContent = title;
  document.getElementById('confBody').textContent  = body;
  document.getElementById('confOk').textContent    = label;
  document.getElementById('confirmWrap').classList.add('on');
}

document.getElementById('confCancel').onclick = () => {
  document.getElementById('confirmWrap').classList.remove('on'); confFn = null;
};
document.getElementById('confOk').onclick = () => {
  document.getElementById('confirmWrap').classList.remove('on');
  if (confFn) { confFn(); confFn = null; }
};
document.getElementById('confirmWrap').addEventListener('click', e => {
  if (e.target === document.getElementById('confirmWrap')) {
    document.getElementById('confirmWrap').classList.remove('on'); confFn = null;
  }
});

// ── Import / Export ───────────────────────────────────────
document.getElementById('hExportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ v:3, at: new Date().toISOString(), tasks: S, history: H }, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: `matrix-${new Date().toISOString().slice(0,10)}.json` });
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported');
};

document.getElementById('hImportBtn').onclick = () => document.getElementById('fileIn').click();

document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!d.tasks) throw new Error();
      importData = d;
      const tc = QS.reduce((n,q) => n + (d.tasks[q]?.length||0), 0);
      const hc = (d.history||[]).length;
      document.getElementById('importBody').textContent =
        `Load ${tc} task${tc!==1?'s':''} and ${hc} history item${hc!==1?'s':''}? Current data will be replaced.`;
      document.getElementById('importWrap').classList.add('on');
    } catch { toast('Invalid file'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

document.getElementById('importCancel').onclick = () => {
  document.getElementById('importWrap').classList.remove('on'); importData = null;
};
document.getElementById('importOk').onclick = () => {
  document.getElementById('importWrap').classList.remove('on');
  if (!importData) return;
  QS.forEach(q => { S[q] = importData.tasks[q] || []; });
  H = importData.history || [];
  importData = null;
  render();
  toast('Imported successfully');
};
document.getElementById('importWrap').addEventListener('click', e => {
  if (e.target === document.getElementById('importWrap')) {
    document.getElementById('importWrap').classList.remove('on'); importData = null;
  }
});

// ── History panel ─────────────────────────────────────────
function openHist() {
  renderHist();
  document.getElementById('histPanel').classList.add('on');
  document.getElementById('ov').classList.add('on');
}
function closeHist() {
  document.getElementById('histPanel').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
}

document.getElementById('hHistBtn').onclick = openHist;
document.getElementById('histClose').onclick = closeHist;
document.getElementById('ov').onclick = closeHist;
document.getElementById('histClrAll').onclick = () => {
  if (!H.length) return;
  openConfirm('Clear history?', 'Permanently remove all history entries.', 'Clear', () => {
    H = []; persist(); renderHist();
  });
};

// ── Toast ─────────────────────────────────────────────────
function toast(msg, undoFn) {
  clearTimeout(toastTmr);
  const el = document.getElementById('toast');
  const ub = document.getElementById('toastUndo');
  document.getElementById('toastMsg').textContent = msg;
  ub.style.display = undoFn ? 'inline' : 'none';
  ub.onclick = undoFn ? () => { undoFn(); hideToast(); } : null;
  el.classList.add('on');
  toastTmr = setTimeout(hideToast, 3000);
}
function hideToast() { document.getElementById('toast').classList.remove('on'); }

// ── Event delegation ──────────────────────────────────────
document.getElementById('mx').addEventListener('click', e => {
  const cb  = e.target.closest('.task-cb');   if (cb)  { toggleTask(cb.dataset.q, cb.dataset.id); return; }
  const del = e.target.closest('.task-del');  if (del) { deleteTask(del.dataset.q, del.dataset.id); return; }
  const add = e.target.closest('.q-plus');    if (add) { addTask(add.dataset.q); return; }
  const clr = e.target.closest('.q-clr');     if (clr) { clearDone(clr.dataset.q); return; }
});

document.getElementById('mx').addEventListener('dblclick', e => {
  const txt = e.target.closest('.task-txt');
  if (txt) startEdit(txt, txt.dataset.q, txt.dataset.id);
});

QS.forEach(q => {
  document.getElementById(`in-${q}`).addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask(q);
  });
});

document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    filt = btn.dataset.f;
    render();
  });
});

document.getElementById('hClearBtn').onclick = clearAll;
document.getElementById('hLockBtn').onclick = showLock;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('confirmWrap').classList.remove('on');
    document.getElementById('importWrap').classList.remove('on');
    closeHist(); confFn = null; importData = null;
  }
  if (e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
  if (e.key === 'h' || e.key === 'H') openHist();
  const map = {'1':'q1','2':'q2','3':'q3','4':'q4'};
  if (map[e.key]) { document.getElementById(`in-${map[e.key]}`).focus(); e.preventDefault(); }
});

// ── Lock screen ───────────────────────────────────────────
async function doUnlock() {
  const input = document.getElementById('lockInput');
  const errEl = document.getElementById('lockError');
  const btn   = document.getElementById('lockSubmit');
  const passcode = input.value;
  if (!passcode) return;

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Unlocking…';

  try {
    const ar = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode })
    });
    if (!ar.ok) { errEl.textContent = 'Incorrect passcode'; input.select(); return; }
    const { token: t } = await ar.json();
    token = t;
    localStorage.setItem('mx_token', t);
    const data = await apiGet();
    if (!data) return;
    S = data.tasks;
    H = data.history;
    hideLock();
    render();
    input.value = '';
  } catch {
    errEl.textContent = 'Connection error — please retry.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
}

document.getElementById('lockSubmit').addEventListener('click', doUnlock);
document.getElementById('lockInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doUnlock();
});

// ── Init ──────────────────────────────────────────────────
async function init() {
  if (token) {
    try {
      const data = await apiGet();
      if (!data) return;
      S = data.tasks;
      H = data.history;
      hideLock();
      render();
    } catch {
      showLock();
    }
  }
}

init();
</script>
</body>
</html>
